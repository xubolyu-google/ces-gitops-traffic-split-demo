      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AniDenyListRequest'
      responses:
        '200':
          description: Successfully checked deny list status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AniDenyListResponse'
              example:
                sessionInfo:
                  parameters:
                    isANIDenyListed: "false"
