components:
  parameters:
    sessionId:
      name: x-session-id
      in: header
      required: true
      description: "Session id of the conversation"
      schema:
        type: string
        default: "callSid_1"

  schemas:
    ErrorDto:
      type: object
      properties:
        status:
          type: string
          description: HTTP status code with description.
          example: 500 Internal Server Error
        error:
          type: string
          description: Detailed error message.
          example: Error details here

    AniLookupRequest:
      type: object
      required:
      - sessionInfo
      properties:
        sessionInfo:
          type: object
          properties:
            parameters:
              type: object
              required:
              - phoneNumber
              properties:
                phoneNumber:
                  type: string
                  description: Phone number for ANI lookup
                  default: "+14802559001"

    AniLookupProactive:
      type: object
      description: Contains proactive ANI lookup details
      properties:
        isFailedAuthMembership:
          type: boolean
        isOrderInstallDelivery:
          type: boolean
        isOrderReadyForPickUp:
          type: boolean
        isOrdersOpen:
          type: boolean
        isOrderOpen15D:
          type: boolean
        isExpiredCard:
          type: boolean
        isOpenRepairs:
          type: boolean
        isRepairAppointment:
          type: boolean
        isTTSContract:
          type: boolean
        isInstoreAppt:
          type: boolean
        callRoutingTagFromBB:
          type: string

    AniLookupResponse:
      type: object
      required:
      - sessionInfo
      properties:
        sessionInfo:
          type: object
          properties:
            parameters:
              type: object
              properties:
                isProactive:
                  $ref: '#/components/schemas/AniLookupProactive'
                fulfillmentType:
                  type: string
                zipCode:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                getItByDate:
                  type: string
                lmiSessionID:
                  type: string
                groupStatus:
                  type: string
                partyID:
                  type: array
                  items:
                    type: string
                appointmentDate:
                  type: string
                membershipStatus:
                  type: string
                membership:
                  type: string
                orderItemApptStartWithinRange:
                  type: boolean
                orders:
                  type: object
                OrderNumber:
                  type: string
                Class:
                  type: string
                Department:
                  type: string
                memberID:
                  type: string
                open_orders_count_15d:
                  type: integer
                isFailedAuthMembership:
                  type: boolean
                with_ani_lookup:
                  type: boolean
                isOrdersOpen:
                  type: boolean
                isOrderOpen15D:
                  type: boolean
                callRoutingTagFromBB:
                  type: string

    AniDenyListRequest:
      type: object
      required:
      - sessionInfo
      properties:
        sessionInfo:
          type: object
          properties:
            parameters:
              type: object
              required:
              - PhoneNumber
              properties:
                PhoneNumber:
                  type: string
                  description: Phone number of the caller
                  example: "4802554881"
                entryPointNumber:
                  type: string
                  description: Optional entry point number
                  example: "656565654"

    AniDenyListResponse:
      type: object
      properties:
        sessionInfo:
          type: object
          properties:
            parameters:
              type: object
              properties:
                isANIDenyListed:
                  type: string
                  description: Indicates if the ANI is on the deny list
                  example: "false"

  responses:
    BadRequestError:
      description: Invalid phone Number or missing parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
          example:
            status: "400 Bad Request"
            error: "Invalid phone number format"
    InternalServerError:
      description: Unexpected error occurred while processing the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
          example:
            status: "500 Internal Server Error"
            error: "Unexpected error occurred"
    ServiceUnavailableError:
      description: The service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
          example:
            status: "503 Service Unavailable"
            error: "Service is down for maintenance"
