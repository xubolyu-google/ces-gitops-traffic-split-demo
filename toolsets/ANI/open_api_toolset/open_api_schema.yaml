openapi: 3.0.0
info:
  title: ANI API
  version: v1
  description: This API allows users to perform an ANI (Automatic Number
    Identification) lookup using a phone number and returns ANI details for the
    provided phone number.
servers:
- url: $env_var
  description: Web-hook base URL for the API
tags:
- name: ANI Lookup
  description: Operations related to Automatic Number Identification lookup

paths:
